name: Actual recognition runtime smoke test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pashto-recognition-worker.js'
      - 'lib/recognition-client.mjs'
      - 'tests/recognition-live.spec.mjs'
      - '.github/workflows/recognition-live.yml'
concurrency:
  group: recognition-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-model:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Download and execute actual Whisper in both browsers
        run: npx playwright test tests/recognition-live.spec.mjs --workers=1 --retries=0
        env:
          PASHTO_LIVE_MODEL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recognition-runtime-evidence
          path: test-results/
