name: Ghag speaker conditioning experiment
on:
  push:
    branches:
      - experiment/ghag-speaker-inference
    paths:
      - 'experiments/inspect-ghag-speakers.py'
      - '.github/workflows/ghag-speaker-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-speakers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned model metadata client
        run: python -m pip install 'huggingface_hub==0.26.5'
      - name: Inspect actual speaker and inference configurations
        run: python experiments/inspect-ghag-speakers.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghag-speaker-analysis
          path: experiment-results/ghag/speaker-analysis.json
          if-no-files-found: warn
