name: Real picture provider smoke test
on:
  pull_request:
    paths:
      - 'scripts/probe-arasaac.mjs'
      - '.github/workflows/arasaac-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/probe-arasaac.mjs
