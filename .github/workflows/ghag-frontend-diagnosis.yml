name: Ghag text frontend diagnosis
on:
  push:
    branches: [experiment/ghag-speaker-inference]
    paths: ['experiments/diagnose-ghag-frontend.py', '.github/workflows/ghag-frontend-diagnosis.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'huggingface_hub==0.26.5'
      - run: python experiments/diagnose-ghag-frontend.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghag-text-frontend
          path: experiment-results/ghag/text-frontend.json
