name: Inspect Ghag model metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 1 * *'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify metadata probe
        run: python -m unittest discover -s tests -p test_ghag_probe.py
      - name: Inspect exact upstream revision and available artifacts
        run: python scripts/probe-ghag-artifacts.py > ghag-artifact-report.json
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghag-artifact-report
          path: ghag-artifact-report.json
          if-no-files-found: warn
