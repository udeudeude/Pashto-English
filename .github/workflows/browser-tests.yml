name: Browser and syntax checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: mobile-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    # Official version-matched image has Chromium, WebKit and system libraries.
    # Prevents every change from downloading browsers and apt dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test Pashto scoring calculations
        run: npm run test:transcripts
      - name: Test word-to-picture coverage and sentence order
        run: npm run test:visual
      - name: Validate cultural review register and vocabulary annotations
        run: node --test tests/cultural-audit.test.mjs tests/cultural-review.test.mjs
      - name: Test readable recognition failure messages
        run: npm run test:speech-errors
      - name: Test recognition worker recovery
        run: npm run test:recognition
      - name: Verify website thumbnails and QR code
        run: npm run test:resources
      - name: Test mobile browsers
        run: npm test
      - name: Upload traces after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: test-results/

  pashto-voice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Produce actual Pashto speech audio
        run: npm run test:voice
      - name: Preserve Pashto audio for fluent-speaker evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-pashto-voice
          path: test-results/pashto-voice.wav
          if-no-files-found: ignore
