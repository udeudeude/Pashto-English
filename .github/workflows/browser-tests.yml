name: Browser and syntax checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: mobile-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Test mobile browsers
        run: npm test
      - name: Upload traces after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: test-results/

  pashto-voice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Produce actual Pashto speech audio
        run: npm run test:voice
      - name: Preserve Pashto audio for fluent-speaker evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-pashto-voice
          path: test-results/pashto-voice.wav
          if-no-files-found: ignore
