name: Verify official Pashto speech control availability
on:
  push:
    branches: [experiment/pashto-fleurs-parquet-fallback]
    paths:
      - 'experiments/fleurs_parquet_controls.py'
      - 'experiments/fleurs_parquet_preflight.py'
      - 'experiments/test_fleurs_parquet_controls.py'
      - 'experiments/pashto_asr_controls.py'
      - 'experiments/test_pashto_asr_controls.py'
      - '.github/workflows/fleurs-parquet-controls.yml'
  pull_request:
    paths:
      - 'experiments/fleurs_parquet_controls.py'
      - 'experiments/fleurs_parquet_preflight.py'
      - 'experiments/test_fleurs_parquet_controls.py'
      - 'experiments/pashto_asr_controls.py'
      - 'experiments/test_pashto_asr_controls.py'
      - '.github/workflows/fleurs-parquet-controls.yml'
permissions:
  contents: read
concurrency:
  group: public-pashto-parquet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only wheel-backed test dependencies
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check --timeout 30 --retries 1 'numpy==1.26.4' 'scipy==1.13.1' 'pyarrow==17.0.0' 'soundfile==0.12.1'
      - name: Run all synthetic Parquet bounds, audio and privacy tests
        run: |
          python -m py_compile experiments/fleurs_parquet_controls.py experiments/fleurs_parquet_preflight.py experiments/pashto_asr_controls.py
          python -m unittest discover -s experiments -p 'test_fleurs_parquet_controls.py' -v
          python -m unittest discover -s experiments -p 'test_pashto_asr_controls.py' -v

  genuine-public-preflight:
    if: github.event_name == 'push'
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded Parquet decoder dependencies
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check --timeout 30 --retries 1 'numpy==1.26.4' 'scipy==1.13.1' 'pyarrow==17.0.0' 'soundfile==0.12.1'
      - name: Check three genuine CC BY 4.0 FLEURS Pashto test controls
        run: |
          python experiments/fleurs_parquet_preflight.py \
            --report experiment-results/fleurs-public-control-source.json
      - name: Retain numerical-only provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-fleurs-pashto-parquet-provenance-only
          path: experiment-results/fleurs-public-control-source.json
          retention-days: 7
          if-no-files-found: ignore

  isolated-recognizer-calibration:
    # Only on isolated branch and only after 3 licensed real controls succeed.
    if: github.event_name == 'push'
    needs: [offline-safety, genuine-public-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HOME: /tmp/pashto-independent-control-cache
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only model runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Install immutable scientific dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'scipy==1.13.1' 'pyarrow==17.0.0' 'soundfile==0.12.1' \
            'transformers==4.46.3' 'huggingface_hub==0.26.5' 'safetensors>=0.4,<1'
      - name: Run original Pashto-trained recognizer on authentic controls
        run: |
          python experiments/pashto_asr_controls.py \
            --report experiment-results/asr/public-pashto-three-controls.json
      - name: Retain numerical control results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-pashto-independent-recognizer-control
          path: experiment-results/asr/public-pashto-three-controls.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove model weights and transient public voice
        if: always()
        run: rm -rf "$HF_HOME" experiment-results/asr/private
