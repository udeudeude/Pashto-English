name: Compact Pashto Whisper genuine-speech calibration
on:
  push:
    branches: [experiment/pashto-compact-whisper-calibration]
    paths:
      - 'experiments/pashto_compact_whisper_probe.py'
      - 'experiments/test_pashto_compact_whisper_probe.py'
      - '.github/workflows/pashto-compact-whisper-probe.yml'
  pull_request:
    paths:
      - 'experiments/pashto_compact_whisper_probe.py'
      - 'experiments/test_pashto_compact_whisper_probe.py'
      - '.github/workflows/pashto-compact-whisper-probe.yml'
permissions:
  contents: read
concurrency:
  group: pashto-compact-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  no-network-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile compact probe and test synthetic provenance only
        run: |
          python -m py_compile experiments/pashto_compact_whisper_probe.py
          python -m unittest discover -s experiments -p 'test_pashto_compact_whisper_probe.py' -v
  licensed-public-cpu-control:
    if: github.event_name == 'push'
    needs: no-network-safety
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HOME: /tmp/compact-pashto-voice-control-cache
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '90'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only scientific runtime and safe model weights parser
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'scipy==1.13.1' 'pyarrow==17.0.0' 'soundfile==0.12.1' \
            'transformers==4.46.3' 'huggingface_hub==0.26.5' 'protobuf==4.25.5' 'safetensors>=0.4,<1'
      - name: Decode three real licensed Pashto controls with compact Whisper
        run: |
          python experiments/pashto_compact_whisper_probe.py \
            --report experiment-results/asr/compact-whisper-three-controls.json
      - name: Preserve numeric-only output, never any audio or model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-compact-pashto-whisper-cpu-report
          path: experiment-results/asr/compact-whisper-three-controls.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Delete experimental model cache and any transient public audio
        if: always()
        run: rm -rf "$HF_HOME" experiment-results/asr/private
